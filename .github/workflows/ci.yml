name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @openmetal/sdk test:npm
      - run: pnpm --filter @openmetal/cli test:integration
      - run: OPENMETAL_CLI_VERSION=0.0.0-ci pnpm --filter @openmetal/cli build:npm
      - run: OPENMETAL_TEST_EXECUTABLE=dist/npm/openmetal.js OPENMETAL_TEST_VERSION=0.0.0-ci pnpm --filter @openmetal/cli exec vitest run test/cli.integration.test.ts
      - run: npm pack ./apps/cli/dist/npm --dry-run
