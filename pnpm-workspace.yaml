packages:
  - apps/*
  - packages/*
allowBuilds:
  cbor-extract: true
  esbuild: true
  protobufjs: true
  simple-git-hooks: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - "@fastify/helmet@13.1.1"
  - freestyle@0.2.13
overrides:
  fast-uri@3: 3.1.7
  fast-uri@4: 4.1.4
  hono: 4.13.7
  js-yaml: 4.3.2
  qs: 6.16.0
  sharp: 0.35.4
  "@modelcontextprotocol/sdk@>= 1.3.0 < 1.32.0": 1.32.0
  "@modelcontextprotocol/sdk@>= 1.6.0 < 1.32.0": 1.32.0
  "@modelcontextprotocol/sdk@< 1.32.0": 1.32.0
  "@modelcontextprotocol/sdk@>= 1.24.0 < 1.32.0": 1.32.0
  "@modelcontextprotocol/sdk@>= 1.12.0 < 1.31.0": 1.32.0
patchedDependencies:
  # React 19 warns when next-themes renders its SSR-only init script on the client.
  # Upstream fix: https://github.com/pacocoursey/next-themes/pull/386
  next-themes@0.4.6: patches/next-themes@0.4.6.patch
