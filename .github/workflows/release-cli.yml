name: release-cli

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version without the cli-v prefix"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-x64
            asset: openmetal-darwin-x64
            executable: openmetal
            archive: tar
          - target: bun-darwin-arm64
            asset: openmetal-darwin-arm64
            executable: openmetal
            archive: tar
          - target: bun-linux-x64
            asset: openmetal-linux-x64
            executable: openmetal
            archive: tar
          - target: bun-linux-arm64
            asset: openmetal-linux-arm64
            executable: openmetal
            archive: tar
          - target: bun-linux-x64-musl
            asset: openmetal-linux-x64-musl
            executable: openmetal
            archive: tar
          - target: bun-linux-arm64-musl
            asset: openmetal-linux-arm64-musl
            executable: openmetal
            archive: tar
          - target: bun-windows-x64
            asset: openmetal-windows-x64
            executable: openmetal.exe
            archive: zip
          - target: bun-windows-arm64
            asset: openmetal-windows-arm64
            executable: openmetal.exe
            archive: zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openmetal/contracts build
      - run: pnpm --filter @openmetal/sdk build
      - name: Build standalone binary
        env:
          OPENMETAL_BUILD_TARGET: ${{ matrix.target }}
          OPENMETAL_BUILD_OUTFILE: dist/${{ matrix.asset }}/${{ matrix.executable }}
          OPENMETAL_CLI_VERSION: ${{ inputs.version || github.ref_name }}
          OPENMETAL_BUILD_COMMIT: ${{ github.sha }}
          OPENMETAL_DEFAULT_API_URL: ${{ vars.OPENMETAL_API_URL }}
          OPENMETAL_DEFAULT_SUPABASE_URL: ${{ vars.OPENMETAL_SUPABASE_URL }}
          OPENMETAL_DEFAULT_SUPABASE_KEY: ${{ vars.OPENMETAL_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm --filter @openmetal/cli build
      - name: Package tar archive
        if: matrix.archive == 'tar'
        run: tar -C "apps/cli/dist/${{ matrix.asset }}" -czf "${{ matrix.asset }}.tar.gz" openmetal
      - name: Package zip archive
        if: matrix.archive == 'zip'
        run: cd "apps/cli/dist/${{ matrix.asset }}" && zip "../../../../${{ matrix.asset }}.zip" openmetal.exe
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.*
          if-no-files-found: error

  smoke:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            executable: openmetal
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            executable: openmetal
          - os: macos-15-intel
            target: bun-darwin-x64
            executable: openmetal
          - os: macos-15
            target: bun-darwin-arm64
            executable: openmetal
          - os: windows-latest
            target: bun-windows-x64
            executable: openmetal.exe
          - os: windows-11-arm
            target: bun-windows-arm64
            executable: openmetal.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openmetal/contracts build
      - run: pnpm --filter @openmetal/sdk build
      - name: Build native smoke binary
        env:
          OPENMETAL_BUILD_TARGET: ${{ matrix.target }}
          OPENMETAL_BUILD_OUTFILE: dist/smoke/${{ matrix.executable }}
          OPENMETAL_CLI_VERSION: smoke
        run: pnpm --filter @openmetal/cli build
      - name: Smoke-test native binary
        env:
          OPENMETAL_TEST_EXECUTABLE: dist/smoke/${{ matrix.executable }}
          OPENMETAL_TEST_VERSION: smoke
        run: pnpm --filter @openmetal/cli exec vitest run test/cli.integration.test.ts

  publish-npm:
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: npm install --global npm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openmetal/contracts build
      - run: pnpm --filter @openmetal/sdk build
      - name: Build npm package
        env:
          OPENMETAL_CLI_VERSION: ${{ inputs.version || github.ref_name }}
          OPENMETAL_BUILD_COMMIT: ${{ github.sha }}
          OPENMETAL_DEFAULT_API_URL: ${{ vars.OPENMETAL_API_URL }}
          OPENMETAL_DEFAULT_SUPABASE_URL: ${{ vars.OPENMETAL_SUPABASE_URL }}
          OPENMETAL_DEFAULT_SUPABASE_KEY: ${{ vars.OPENMETAL_SUPABASE_PUBLISHABLE_KEY }}
        run: pnpm --filter @openmetal/cli build:npm
      - name: Pack and smoke-test npm package
        env:
          EXPECTED_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          package_json="$(npm pack ./apps/cli/dist/npm --pack-destination "$RUNNER_TEMP" --json)"
          tarball="$(printf '%s' "$package_json" | node -e 'let input=\"\"; process.stdin.on(\"data\", chunk => input += chunk).on(\"end\", () => console.log(JSON.parse(input)[0].filename))')"
          smoke_dir="$RUNNER_TEMP/openmetal-npm-smoke"
          mkdir -p "$smoke_dir"
          npm install --prefix "$smoke_dir" "$RUNNER_TEMP/$tarball"
          actual_version="$("$smoke_dir/node_modules/.bin/openmetal" --json version | node -e 'let input=\"\"; process.stdin.on(\"data\", chunk => input += chunk).on(\"end\", () => console.log(JSON.parse(input).version))')"
          expected_version="${EXPECTED_VERSION#cli-v}"
          test "$actual_version" = "$expected_version"
      - name: Check npm version
        id: npm-version
        env:
          PACKAGE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version="${PACKAGE_VERSION#cli-v}"
          if npm view "@openmetal/cli@$version" version --json >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish npm package
        if: steps.npm-version.outputs.exists != 'true'
        run: npm publish ./apps/cli/dist/npm --access public

  release:
    needs: [build, smoke, publish-npm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: sha256sum openmetal-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('cli-v{0}', inputs.version) }}
        run: gh release create "$TAG" dist/* --generate-notes --title "OpenMetal CLI ${TAG#cli-v}"
